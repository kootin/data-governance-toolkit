[project]
name = "data-governance-toolkit"
version = "0.1.0"
description = "Data contracts, quality checks, PII discovery, masking, lineage and access-control reviews"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.0", "pyyaml>=6", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
governance-report = "governance.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
